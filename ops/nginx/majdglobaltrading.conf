server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name majdglobaltrading.com www.majdglobaltrading.com;
    ssl_certificate /etc/letsencrypt/live/majdglobaltrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/majdglobaltrading.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    charset utf-8;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ^~ /uploads/ {
        alias /var/lib/mgt/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    access_log /var/log/nginx/majdglobaltrading.access.log;
    error_log /var/log/nginx/majdglobaltrading.error.log;
}
server {
    listen 80;
    listen [::]:80;
    server_name majdglobaltrading.com www.majdglobaltrading.com;
    return 301 https://$host$request_uri;
}
